name: DA Secure Flutter Runtime Worker Verify

on:
  push:
    branches:
      - worker/da-secure-flutter-runtime-api
  pull_request:
    branches:
      - feat/secure-qr-mobile-app-isolated
    paths:
      - 'mobile/da_secure/**'
      - '.github/workflows/flutter-runtime-worker-verify.yml'

permissions:
  contents: read

jobs:
  flutter-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/da_secure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: da-secure-debug-apk-${{ github.sha }}
          path: mobile/da_secure/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
