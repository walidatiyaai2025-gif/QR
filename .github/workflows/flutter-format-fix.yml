name: DA Secure Flutter Format Fix

on:
  push:
    branches:
      - worker/da-secure-firebase-flutter-fcm-closure

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: worker/da-secure-firebase-flutter-fcm-closure
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: mobile/da_secure
        run: flutter pub get
      - name: Apply Dart formatter
        working-directory: mobile/da_secure
        run: dart format lib test
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/da_secure/lib mobile/da_secure/test mobile/da_secure/analysis_options.yaml mobile/da_secure/pubspec.lock
          git commit -m "style(mobile): apply Dart formatter"
          git push origin HEAD:worker/da-secure-firebase-flutter-fcm-closure
