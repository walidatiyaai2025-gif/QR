name: DA Secure Runtime Convergence Format Capture

on:
  push:
    branches:
      - lead/da-secure-runtime-convergence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/da_secure
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Apply canonical formatter
        run: dart format lib/firebase/firebase_messaging_coordinator.dart
      - name: Upload formatted coordinator
        uses: actions/upload-artifact@v4
        with:
          name: da-secure-formatted-coordinator
          path: mobile/da_secure/lib/firebase/firebase_messaging_coordinator.dart
          if-no-files-found: error
          retention-days: 1
