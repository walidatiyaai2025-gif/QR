name: DA Secure Localization P2 Closure Verify

on:
  push:
    branches:
      - worker/da-secure-localization-p2-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend-release-build-test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact P2 closure head
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore SecureQrPortal.sln

      - name: Build Release
        run: dotnet build SecureQrPortal.sln -c Release

      - name: Test Release
        run: dotnet test SecureQrPortal.sln -c Release

  flutter:
    name: flutter-format-analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile/da_secure
    steps:
      - name: Checkout exact P2 closure head
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Dart format
        shell: bash
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
