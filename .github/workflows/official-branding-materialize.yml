name: DA Secure Official Branding Materialize

on:
  push:
    branches:
      - worker/da-secure-official-branding
    paths:
      - '.branding-source/crest_compact.b64'
      - '.github/workflows/official-branding-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-build-inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branding branch
        uses: actions/checkout@v4
        with:
          ref: worker/da-secure-official-branding
          fetch-depth: 0

      - name: Install Python imaging support
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Materialize owner-supplied crest and Android launcher resources
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .branding-source/crest_compact.b64 > /tmp/diwan_crest.png
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          root = Path('.')
          src = Path('/tmp/diwan_crest.png')
          im = Image.open(src).convert('RGBA')
          if im.width < 128 or im.height < 128:
              raise SystemExit(f'crest unexpectedly small: {im.size}')

          brand = root / 'mobile/da_secure/assets/brand'
          brand.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(src, brand / 'diwan_crest.png')

          res = root / 'mobile/da_secure/android/app/src/main/res'
          navy = (6, 28, 51, 255)
          densities = {
              'mdpi': (1.0, 48),
              'hdpi': (1.5, 72),
              'xhdpi': (2.0, 96),
              'xxhdpi': (3.0, 144),
              'xxxhdpi': (4.0, 192),
          }

          def fit(source, max_w, max_h):
              ratio = min(max_w/source.width, max_h/source.height)
              size = (max(1, round(source.width*ratio)), max(1, round(source.height*ratio)))
              return source.resize(size, Image.Resampling.LANCZOS)

          for density, (factor, legacy_size) in densities.items():
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)

              # Legacy launcher: deep navy field with the official crest centered.
              legacy = Image.new('RGBA', (legacy_size, legacy_size), navy)
              crest = fit(im, legacy_size * 0.72, legacy_size * 0.72)
              legacy.alpha_composite(crest, ((legacy_size-crest.width)//2, (legacy_size-crest.height)//2))
              legacy.save(folder / 'ic_launcher.png', optimize=True)
              legacy.save(folder / 'ic_launcher_round.png', optimize=True)

              # Adaptive foreground canvas is 108dp. Keep artwork inside the 66dp safe zone.
              adaptive_size = round(108 * factor)
              safe_size = round(66 * factor)
              foreground = Image.new('RGBA', (adaptive_size, adaptive_size), (0, 0, 0, 0))
              fg_crest = fit(im, safe_size, safe_size)
              foreground.alpha_composite(
                  fg_crest,
                  ((adaptive_size-fg_crest.width)//2, (adaptive_size-fg_crest.height)//2),
              )
              foreground.save(folder / 'ic_launcher_foreground.png', optimize=True)

          values = res / 'values'
          values.mkdir(parents=True, exist_ok=True)
          (values / 'colors.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="ic_launcher_background">#061C33</color>\n'
              '</resources>\n', encoding='utf-8')

          anydpi = res / 'mipmap-anydpi-v26'
          anydpi.mkdir(parents=True, exist_ok=True)
          adaptive_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/ic_launcher_background" />\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground" />\n'
              '</adaptive-icon>\n'
          )
          (anydpi / 'ic_launcher.xml').write_text(adaptive_xml, encoding='utf-8')
          (anydpi / 'ic_launcher_round.xml').write_text(adaptive_xml, encoding='utf-8')

          manifest = root / 'mobile/da_secure/android/app/src/main/AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8')
          if 'android:icon=' not in text:
              text = text.replace(
                  'android:label="DA Secure"\n        android:name="${applicationName}"',
                  'android:label="DA Secure"\n        android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"\n        android:name="${applicationName}"',
              )
          manifest.write_text(text, encoding='utf-8')
          PY

          grep -F 'applicationId = "com.qr.mobile.da"' mobile/da_secure/android/app/build.gradle.kts
          grep -F 'android:icon="@mipmap/ic_launcher"' mobile/da_secure/android/app/src/main/AndroidManifest.xml
          grep -F 'android:roundIcon="@mipmap/ic_launcher_round"' mobile/da_secure/android/app/src/main/AndroidManifest.xml
          test -f mobile/da_secure/assets/brand/diwan_crest.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "mobile/da_secure/android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            test -f "mobile/da_secure/android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.png"
          done
          test -f mobile/da_secure/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Commit authoritative branding result before build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .branding-source
          rm -f .github/workflows/official-branding-materialize.yml
          git config user.name 'DA Secure Branding Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(mobile): apply official DA Secure launcher branding'
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:worker/da-secure-official-branding
          test -z "$(git status --porcelain)"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build exact final branding SHA
        working-directory: mobile/da_secure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          flutter pub get
          flutter build apk --debug

      - name: Inspect packaged launcher resources
        shell: bash
        run: |
          set -euo pipefail
          APK='mobile/da_secure/build/app/outputs/flutter-apk/app-debug.apk'
          test -s "$APK"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          "$AAPT2" dump resources "$APK" > /tmp/aapt2-resources.txt
          grep -F 'mipmap/ic_launcher' /tmp/aapt2-resources.txt
          grep -F 'mipmap/ic_launcher_round' /tmp/aapt2-resources.txt
          grep -F 'mipmap/ic_launcher_foreground' /tmp/aapt2-resources.txt
          grep -F 'color/ic_launcher_background' /tmp/aapt2-resources.txt
          unzip -l "$APK" > /tmp/apk-files.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          {
            echo "OFFICIAL CREST: PASS"
            echo "LAUNCHER ICON: PASS"
            echo "ADAPTIVE ICON: PASS"
            echo "DEFAULT ANDROID ICON REMOVED: YES"
            echo "APK BUILD: PASS"
            echo "EXACT SHA: $FINAL_SHA"
            echo "PACKAGE: com.qr.mobile.da"
            echo "BACKGROUND: #061C33"
            echo "CREST RESOURCE: assets/brand/diwan_crest.png"
          } | tee /tmp/branding-report.txt

      - name: Upload debug APK and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: da-secure-official-branding-debug-apk
          path: |
            mobile/da_secure/build/app/outputs/flutter-apk/app-debug.apk
            /tmp/branding-report.txt
            /tmp/apk.sha256
            /tmp/aapt2-resources.txt
          if-no-files-found: error
          retention-days: 14
