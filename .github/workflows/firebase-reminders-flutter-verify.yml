name: DA Secure Firebase Flutter Verify

on:
  push:
    branches:
      - worker/da-secure-firebase-reminders
    paths:
      - 'mobile/da_secure/**'
      - '.github/workflows/firebase-reminders-flutter-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-fcm-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/da_secure
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: da-secure-worker3-debug-apk
          path: mobile/da_secure/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
