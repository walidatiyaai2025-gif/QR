name: DA Secure IIS Deployment Package

on:
  push:
    branches:
      - worker/da-secure-iis-deployment-closure
    paths:
      - 'deployment/iis/**'
      - 'src/SecureQrPortal/**'
      - '.github/workflows/iis-deployment-package.yml'

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: PowerShell parser validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem deployment/iis -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $_.Extent.Text, $_.Message) }
              throw "PowerShell parse failed: $($_.Name)"
            }
          }

      - name: Deployment safety policy checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $common = Get-Content deployment/iis/QR-IIS.Common.ps1 -Raw
          foreach ($required in @(
            "'/XD'",
            "'App_Data'",
            'Assert-NoFirebaseCredentialInPublish',
            'Automatic rollback is starting',
            'Firebase__CredentialPath',
            'GOOGLE_APPLICATION_CREDENTIALS',
            'Wait-ForHealth'
          )) {
            if (-not $common.Contains($required)) { throw "Missing deployment safety marker: $required" }
          }
          Get-ChildItem deployment/iis -Filter '*.ps1' | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            if ($text -match '(?im)Remove-Item[^\r\n]*App_Data') {
              throw "Unsafe App_Data deletion expression found in $($_.Name)."
            }
          }

      - name: Restore
        run: dotnet restore src/SecureQrPortal/SecureQrPortal.csproj

      - name: Publish deterministic Release
        run: dotnet publish src/SecureQrPortal/SecureQrPortal.csproj -c Release --no-restore -o out/publish -p:ContinuousIntegrationBuild=true -p:SourceRevisionId=e9c62cd8ba215e5f1e038cdddb9776acc70990bb

      - name: Reject service-account credentials from publish
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem out/publish -Filter '*.json' -File -Recurse | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            if ($text -match '"private_key"\s*:' -and $text -match '"client_email"\s*:') {
              throw "Service-account credential JSON must not be packaged: $($_.Name)"
            }
          }

      - name: Verify locked package provenance and build artifact
        id: package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedVersion = '1.0.0-iis.1'
          $expectedSourceBranch = 'lead/da-secure-runtime-convergence'
          $expectedSourceSha = 'e9c62cd8ba215e5f1e038cdddb9776acc70990bb'
          $manifest = Get-Content deployment/iis/BUILD-MANIFEST.json -Raw | ConvertFrom-Json
          $dotnetVersion = (& dotnet --version).Trim()
          $payload = Join-Path $PWD 'out/publish/SecureQrPortal.dll'
          if (-not (Test-Path $payload)) { throw 'SecureQrPortal.dll is missing from publish output.' }
          $hash = (Get-FileHash -Algorithm SHA256 $payload).Hash.ToLowerInvariant()

          if ($manifest.packageVersion -ne $expectedVersion) { throw 'Manifest packageVersion mismatch.' }
          if ($manifest.sourceBranch -ne $expectedSourceBranch) { throw 'Manifest sourceBranch mismatch.' }
          if ($manifest.sourceSha -ne $expectedSourceSha) { throw 'Manifest sourceSha mismatch.' }
          if ($manifest.dotnetTargetFramework -ne 'net10.0') { throw 'Manifest target framework mismatch.' }
          if ($manifest.dotnetVersion -ne $dotnetVersion) { throw "Manifest .NET version mismatch: expected $($manifest.dotnetVersion), actual $dotnetVersion." }
          if ($manifest.artifactHash.algorithm -ne 'SHA256') { throw 'Manifest artifact hash algorithm mismatch.' }
          if ($manifest.artifactHash.target -ne 'publish/SecureQrPortal.dll') { throw 'Manifest artifact hash target mismatch.' }
          if ($manifest.artifactHash.value -ne $hash) { throw "Deterministic payload hash mismatch: manifest=$($manifest.artifactHash.value) actual=$hash" }

          $packageRoot = Join-Path $PWD "out/DA-Secure-IIS-$expectedVersion"
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item out/publish (Join-Path $packageRoot 'publish') -Recurse
          Copy-Item deployment/iis/Install-QR-IIS.ps1 $packageRoot
          Copy-Item deployment/iis/Update-QR-IIS.ps1 $packageRoot
          Copy-Item deployment/iis/Rollback-QR-IIS.ps1 $packageRoot
          Copy-Item deployment/iis/QR-IIS.Common.ps1 $packageRoot
          Copy-Item deployment/iis/README.md $packageRoot
          Copy-Item deployment/iis/BUILD-MANIFEST.json $packageRoot

          Write-Host "Locked payload SHA256 verified: $hash"
          "payload_hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload IIS deployment package
        uses: actions/upload-artifact@v4
        with:
          name: da-secure-iis-1.0.0-iis.1-${{ github.sha }}
          path: out/DA-Secure-IIS-1.0.0-iis.1
          if-no-files-found: error
          retention-days: 14
