name: DA Secure Final Release Gate

on:
  push:
    branches:
      - worker/da-secure-final-release-assembly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition:
    name: exact-composition-and-content
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source and required authorities
        shell: bash
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          test "$final_sha" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'worker/da-secure-final-release-assembly'

          branding='63dafa435086c69e02627e1e9c70caa6617c0046'
          iis='457078e6f744222ccab86ca129a687b9fd6490df'
          for sha in "$branding" "$iis"; do
            git cat-file -e "$sha^{commit}"
            git merge-base --is-ancestor "$sha" HEAD
          done

          # Official owner-supplied branding must remain byte-identical to verified branding.
          branding_paths=(
            mobile/da_secure/assets/brand/diwan_crest.png
            mobile/da_secure/android/app/src/main/AndroidManifest.xml
            mobile/da_secure/android/app/src/main/res/values/colors.xml
            mobile/da_secure/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            mobile/da_secure/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          )
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            branding_paths+=(
              "mobile/da_secure/android/app/src/main/res/mipmap-${density}/ic_launcher.png"
              "mobile/da_secure/android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
              "mobile/da_secure/android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.png"
            )
          done
          for path in "${branding_paths[@]}"; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$branding:$path")"
          done

          test -s mobile/da_secure/assets/brand/diwan_crest.png
          grep -Fq "assets/brand/diwan_crest.png" mobile/da_secure/lib/design_system/premium_visuals.dart
          grep -Fq 'DaBrandIdentity' mobile/da_secure/lib/features/splash/presentation/splash_screen.dart
          grep -Fq 'android:icon="@mipmap/ic_launcher"' mobile/da_secure/android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@mipmap/ic_launcher_round"' mobile/da_secure/android/app/src/main/AndroidManifest.xml
          test -s mobile/da_secure/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s mobile/da_secure/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # Local-only Noto Sans Arabic font contract.
          grep -Fq 'family: NotoSansArabic' mobile/da_secure/pubspec.yaml
          grep -Fq 'NotoSansArabic[wdth,wght].ttf' mobile/da_secure/pubspec.yaml
          test -s 'mobile/da_secure/assets/fonts/noto_sans_arabic/NotoSansArabic[wdth,wght].ttf'
          test -s mobile/da_secure/assets/fonts/noto_sans_arabic/OFL.txt
          grep -Fq "static const fontFamily = 'NotoSansArabic';" mobile/da_secure/lib/design_system/da_secure_theme.dart
          if grep -RInE 'GoogleFonts|google_fonts|fonts\.googleapis\.com|fonts\.gstatic\.com' mobile/da_secure/lib mobile/da_secure/pubspec.yaml; then
            echo 'Runtime/remote font dependency detected.' >&2
            exit 1
          fi

          # P2 date/Bidi protections and bilingual directionality contracts.
          grep -Fq 'DaPresentationText.localizedRuntimeDate' mobile/da_secure/lib/features/inbox/presentation/inbox_screen.dart
          grep -Fq 'DaPresentationText.isolateTechnical' mobile/da_secure/lib/features/inbox/presentation/inbox_screen.dart
          grep -Fq 'DaPresentationText.localizedRuntimeDate' mobile/da_secure/lib/features/inbox/presentation/secure_message_screen.dart
          grep -Fq 'DaPresentationText.isolateDynamic' mobile/da_secure/lib/features/inbox/presentation/secure_message_screen.dart
          grep -Fq "Arabic uses RTL and English uses LTR" mobile/da_secure/test/mobile_ui_contract_test.dart
          grep -Fq 'const widths = <double>[360, 375, 390, 412, 430];' mobile/da_secure/test/mobile_ui_contract_test.dart

          # Exact IIS hotfix implementation must be present.
          test "$(git rev-parse HEAD:deployment/iis/QR-IIS.Common.ps1)" = "$(git rev-parse "$iis:deployment/iis/QR-IIS.Common.ps1")"

          printf 'FINAL_SHA=%s\n' "$final_sha" | tee final-source-sha.txt

      - name: Upload source identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: DA-Secure-FINAL-source-identity
          path: final-source-sha.txt
          if-no-files-found: error
          retention-days: 30

  secret-scan:
    name: secret-scan
    needs: composition
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  backend:
    name: backend-release-and-admin-qr
    needs: composition
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify backend evidence SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore solution
        run: dotnet restore SecureQrPortal.sln

      - name: Build Release
        run: dotnet build SecureQrPortal.sln -c Release --no-restore

      - name: Full backend tests
        run: dotnet test SecureQrPortal.sln -c Release --no-build --logger "trx;LogFileName=DA-Secure-FINAL-backend.trx" --results-directory TestResults

      - name: Authenticated Admin QR HTTP 200 regression
        run: dotnet test tests/SecureQrPortal.Tests/SecureQrPortal.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~QrRegistryMvcTests.Qr_registry_renders_with_real_organization_linked_secure_page" --logger "trx;LogFileName=DA-Secure-FINAL-admin-qr.trx" --results-directory TestResults

      - name: Write backend provenance evidence
        shell: bash
        run: |
          printf 'FINAL_SHA=%s\nADMIN_QR=HTTP_200_TEST_PASS\n' "$GITHUB_SHA" > TestResults/FINAL-SHA.txt

      - name: Upload backend evidence
        uses: actions/upload-artifact@v4
        with:
          name: DA-Secure-FINAL-backend-evidence
          path: TestResults
          if-no-files-found: error
          retention-days: 30

  mobile:
    name: flutter-final-apk
    needs: composition
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: mobile/da_secure
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify APK source SHA
        shell: bash
        working-directory: ${{ github.workspace }}
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter full tests
        run: flutter test

      - name: Explicit width RTL/LTR regression suite
        run: flutter test test/mobile_ui_contract_test.dart

      - name: Explicit P2 localization regression suite
        run: flutter test test/localization_p2_presentation_test.dart

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Inspect final packaged mobile content
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-debug.apk'
          test -s "$apk"

          # Flutter bundle content is verified by its stable asset basenames rather than
          # assuming an APK ZIP directory layout that can vary by Android tooling.
          unzip -Z1 "$apk" | tee /tmp/apk-files.txt >/dev/null
          grep -Fq 'diwan_crest.png' /tmp/apk-files.txt
          grep -Fq 'NotoSansArabic' /tmp/apk-files.txt

          # Verify the compiled application identity and launcher resources through AAPT.
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          aapt_bin="$(find "$sdk_root/build-tools" -type f -name aapt -perm -111 | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          "$aapt_bin" dump badging "$apk" | tee /tmp/apk-badging.txt
          grep -Fq "package: name='com.qr.mobile.da'" /tmp/apk-badging.txt
          grep -Fq "application-label:'DA Secure'" /tmp/apk-badging.txt
          grep -Eq "application: label='DA Secure'.*icon='res/[^']+'" /tmp/apk-badging.txt

          "$aapt_bin" dump resources "$apk" | tee /tmp/apk-resources.txt >/dev/null
          grep -Fq 'mipmap/ic_launcher' /tmp/apk-resources.txt
          grep -Fq 'mipmap/ic_launcher_round' /tmp/apk-resources.txt

          cp "$apk" "$GITHUB_WORKSPACE/DA-Secure-FINAL.apk"
          printf 'FINAL_SHA=%s\nAPK_SOURCE_SHA=%s\n' "$GITHUB_SHA" "$GITHUB_SHA" > "$GITHUB_WORKSPACE/APK-SOURCE-SHA.txt"
          sha256sum "$GITHUB_WORKSPACE/DA-Secure-FINAL.apk" > "$GITHUB_WORKSPACE/DA-Secure-FINAL.apk.sha256"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: DA-Secure-FINAL-APK
          path: |
            DA-Secure-FINAL.apk
            APK-SOURCE-SHA.txt
            DA-Secure-FINAL.apk.sha256
          if-no-files-found: error
          retention-days: 30

  iis:
    name: iis-final-package
    needs: composition
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify IIS source SHA
        shell: powershell
        run: |
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $gha = "$env:GITHUB_SHA".Trim().ToLowerInvariant()
          if ($head -ne $gha) { throw "IIS source SHA mismatch: HEAD=$head GITHUB_SHA=$gha" }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Parse and regression-test IIS scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem deployment/iis -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $($_.Name)" }
          }
          & .\deployment\iis\Test-QR-IIS.Regression.ps1

      - name: Restore IIS source project
        run: dotnet restore src/SecureQrPortal/SecureQrPortal.csproj

      - name: Publish IIS payload from exact final SHA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = "$env:GITHUB_SHA".Trim().ToLowerInvariant()
          dotnet publish src/SecureQrPortal/SecureQrPortal.csproj -c Release --no-restore -o out/publish -p:ContinuousIntegrationBuild=true -p:Deterministic=true -p:SourceRevisionId=$sha
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          $dll = Resolve-Path 'out/publish/SecureQrPortal.dll'
          $binaryText = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($dll))
          if (-not $binaryText.Contains($sha)) { throw "Published DLL does not contain exact SourceRevisionId $sha" }

          Get-ChildItem out/publish -Filter '*.json' -File -Recurse | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            if ($text -match '"private_key"\s*:' -and $text -match '"client_email"\s*:') {
              throw "Service-account credential JSON must not be packaged: $($_.FullName)"
            }
          }

      - name: Build DA-Secure-FINAL-IIS.zip and exact manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = "$env:GITHUB_SHA".Trim().ToLowerInvariant()
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sourceSha -ne $head) { throw "Manifest source mismatch before packaging: $sourceSha != $head" }

          $packageRoot = Join-Path $PWD 'out/DA-Secure-FINAL-IIS'
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item out/publish (Join-Path $packageRoot 'publish') -Recurse
          Copy-Item deployment/iis/Install-QR-IIS.ps1 $packageRoot
          Copy-Item deployment/iis/Update-QR-IIS.ps1 $packageRoot
          Copy-Item deployment/iis/Rollback-QR-IIS.ps1 $packageRoot
          Copy-Item deployment/iis/QR-IIS.Common.ps1 $packageRoot
          Copy-Item deployment/iis/Test-QR-IIS.Regression.ps1 $packageRoot
          Copy-Item deployment/iis/README.md $packageRoot

          $payload = Join-Path $packageRoot 'publish/SecureQrPortal.dll'
          $payloadHash = (Get-FileHash -Algorithm SHA256 $payload).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            packageName = 'DA-Secure-FINAL-IIS.zip'
            packageVersion = 'FINAL'
            sourceBranch = "$env:GITHUB_REF_NAME"
            sourceSha = $sourceSha
            buildTimestampUtc = [DateTime]::UtcNow.ToString('o')
            dotnetVersion = (& dotnet --version).Trim()
            targetFramework = 'net10.0'
            artifactHash = [ordered]@{
              algorithm = 'SHA256'
              target = 'publish/SecureQrPortal.dll'
              value = $payloadHash
            }
          }
          $manifestPath = Join-Path $packageRoot 'BUILD-MANIFEST.json'
          $manifest | ConvertTo-Json -Depth 5 | Set-Content $manifestPath -Encoding utf8

          $written = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($written.sourceSha.ToLowerInvariant() -ne $sourceSha) { throw 'IIS manifest sourceSha mismatch.' }
          Copy-Item $manifestPath (Join-Path $PWD 'IIS-BUILD-MANIFEST.json')

          $zipPath = Join-Path $PWD 'DA-Secure-FINAL-IIS.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zipPath -CompressionLevel Optimal
          if (-not (Test-Path $zipPath)) { throw 'Final IIS ZIP was not created.' }
          (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant() | Set-Content 'DA-Secure-FINAL-IIS.zip.sha256' -Encoding ascii

      - name: Upload final IIS package
        uses: actions/upload-artifact@v4
        with:
          name: DA-Secure-FINAL-IIS
          path: |
            DA-Secure-FINAL-IIS.zip
            IIS-BUILD-MANIFEST.json
            DA-Secure-FINAL-IIS.zip.sha256
          if-no-files-found: error
          retention-days: 30

  provenance:
    name: final-provenance-gate
    needs:
      - composition
      - secret-scan
      - backend
      - mobile
      - iis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Final exact-SHA gate
        shell: bash
        run: |
          set -euo pipefail
          final_sha="$(git rev-parse HEAD)"
          test "$final_sha" = "$GITHUB_SHA"
          git merge-base --is-ancestor 63dafa435086c69e02627e1e9c70caa6617c0046 HEAD
          git merge-base --is-ancestor 457078e6f744222ccab86ca129a687b9fd6490df HEAD
          printf 'FINAL_SHA=%s\nPROVENANCE_MATCH=PASS\nSECRET_SCAN=PASS\n' "$final_sha"
