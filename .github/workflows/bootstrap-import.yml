name: Bootstrap source import

on:
  workflow_dispatch:
  push:
    branches:
      - feat/secure-qr-portal-v1.0.0
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: windows-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and import complete source tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem -LiteralPath 'bootstrap' -Filter 'part*.b64' | Sort-Object Name
          if ($parts.Count -ne 11) {
            throw "Expected 11 bootstrap chunks, found $($parts.Count)."
          }

          $encoded = ($parts | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'SecureQrPortal-source.zip'
          [System.IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))

          $expanded = Join-Path $env:RUNNER_TEMP 'SecureQrPortal-source'
          if (Test-Path $expanded) { Remove-Item $expanded -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded -Force

          Get-ChildItem -LiteralPath $expanded -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination '.' -Recurse -Force
          }

          Remove-Item -LiteralPath 'bootstrap' -Recurse -Force
          Remove-Item -LiteralPath '.github/workflows/bootstrap-import.yml' -Force

          if (-not (Test-Path 'SecureQrPortal.sln')) { throw 'SecureQrPortal.sln was not imported.' }
          if (-not (Test-Path 'src/SecureQrPortal/SecureQrPortal.csproj')) { throw 'Web project was not imported.' }
          if (-not (Test-Path 'tests/SecureQrPortal.Tests/SecureQrPortal.Tests.csproj')) { throw 'Test project was not imported.' }
          if (-not (Test-Path 'Last Approved Patch/Install-QR-IIS.ps1')) { throw 'Approved IIS installer was not imported.' }
          if (-not (Test-Path '.github/workflows/ci.yml')) { throw 'CI workflow was not imported.' }

      - name: Commit imported product source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No source import changes to commit.'
            exit 0
          }
          git commit -m 'feat: import complete Secure QR Portal v1.0.0 source [skip bootstrap]'
          git push origin "HEAD:${{ github.ref_name }}"

