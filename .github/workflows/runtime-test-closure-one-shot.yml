name: DA Secure Runtime Test Closure One Shot

on:
  push:
    branches:
      - lead/da-secure-runtime-convergence
    paths:
      - .github/workflows/runtime-test-closure-one-shot.yml

permissions:
  contents: write

jobs:
  validate-commit-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lead/da-secure-runtime-convergence
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply exact test-harness closure patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mobile/da_secure/test/runtime_contract_test.dart')
          text = path.read_text()

          text = text.replace(
              "import 'dart:io';\n",
              "import 'dart:convert';\nimport 'dart:io';\nimport 'dart:typed_data';\n",
              1,
          )
          text = text.replace(
              "import 'package:da_secure/config/app_config.dart';\n",
              "import 'package:da_secure/config/app_config.dart';\nimport 'package:da_secure/firebase/firebase_messaging_coordinator.dart';\n",
              1,
          )
          text = text.replace('late _QueueApiInterceptor api;', 'late _QueueHttpClientAdapter api;')
          text = text.replace('late _QueueApiInterceptor refresh;', 'late _QueueHttpClientAdapter refresh;')

          old_setup = """    client = ApiClient(storage: storage, dio: apiDio, refreshDio: refreshDio);
              api = _QueueApiInterceptor();
              refresh = _QueueApiInterceptor();
              apiDio.interceptors.add(api);
              refreshDio.interceptors.add(refresh);
          """.replace('              ', '    ')
          new_setup = """    api = _QueueHttpClientAdapter();
              refresh = _QueueHttpClientAdapter();
              apiDio.httpClientAdapter = api;
              refreshDio.httpClientAdapter = refresh;
              client = ApiClient(storage: storage, dio: apiDio, refreshDio: refreshDio);
          """.replace('              ', '    ')
          if old_setup not in text:
              raise SystemExit('setup marker not found')
          text = text.replace(old_setup, new_setup, 1)

          start_marker = """    test(
                '40 push payload without deliveryId is rejected by coordinator',
          """.replace('                ', '      ')
          start = text.index(start_marker)
          end_marker = "\n  });\n}\n\nclass _QueueApiInterceptor extends Interceptor {"
          end = text.index(end_marker, start)
          behavioral = """    test('40 push payload without deliveryId is rejected by coordinator', () {
              expect(
                SafeDeliveryPush.tryParse({
                  'category': 'delivery',
                  'version': '1',
                }),
                isNull,
              );
            });

            test('41 malformed or non-positive deliveryId is ignored safely', () {
              for (final deliveryId in <Object?>['bad', '', '0', '-1', null]) {
                expect(
                  SafeDeliveryPush.tryParse({
                    if (deliveryId != null) 'deliveryId': deliveryId,
                    'category': 'delivery',
                    'version': '1',
                  }),
                  isNull,
                  reason: 'deliveryId=$deliveryId',
                );
              }

              final valid = SafeDeliveryPush.tryParse({
                'deliveryId': '42',
                'category': 'delivery',
                'version': '1',
              });
              expect(valid?.deliveryId, '42');
            });

            test('42 push routing rejects protected body and secret metadata', () {
              for (final forbiddenKey in <String>[
                'body',
                'content',
                'contentEnglishHtml',
                'contentArabicHtml',
                'revealToken',
                'accessToken',
                'refreshToken',
                'attachments',
              ]) {
                expect(
                  SafeDeliveryPush.tryParse({
                    'deliveryId': '42',
                    'category': 'delivery',
                    'version': '1',
                    forbiddenKey: 'protected-value',
                  }),
                  isNull,
                  reason: forbiddenKey,
                );
              }

              final safe = SafeDeliveryPush.tryParse({
                'deliveryId': '42',
                'category': 'delivery',
                'version': '1',
              });
              expect(safe?.deliveryId, '42');
              expect(safe?.category, 'delivery');
            });

            test('43 foreground-safe payload validates category and version', () {
              for (final category in <String>['delivery', 'reminder']) {
                final push = SafeDeliveryPush.tryParse({
                  'deliveryId': '42',
                  'category': category,
                  'version': '1',
                });
                expect(push?.category, category);
              }

              expect(
                SafeDeliveryPush.tryParse({
                  'deliveryId': '42',
                  'category': 'other',
                  'version': '1',
                }),
                isNull,
              );
              expect(
                SafeDeliveryPush.tryParse({
                  'deliveryId': '42',
                  'category': 'delivery',
                  'version': '2',
                }),
                isNull,
              );
              expect(
                SafeDeliveryPush.tryParse({
                  'deliveryId': '42',
                  'notificationCategory': 'secure_delivery',
                  'version': '1',
                })?.deliveryId,
                '42',
              );
            });
          """.replace('            ', '    ')
          text = text[:start] + behavioral + text[end:]

          class_start = text.index('class _QueueApiInterceptor extends Interceptor {')
          class_end = text.index('class _QueuedReply {', class_start)
          adapter = """class _QueueHttpClientAdapter implements HttpClientAdapter {
            final Map<String, List<_QueuedReply>> _replies = {};
            final List<RequestOptions> history = [];

            void enqueue(String method, String path, int statusCode, dynamic data) {
              final key = '${method.toUpperCase()} $path';
              _replies.putIfAbsent(key, () => []).add(_QueuedReply(statusCode, data));
            }

            @override
            Future<ResponseBody> fetch(
              RequestOptions options,
              Stream<Uint8List>? requestStream,
              Future<void>? cancelFuture,
            ) async {
              history.add(options);
              final key = '${options.method.toUpperCase()} ${options.path}';
              final queue = _replies[key];
              if (queue == null || queue.isEmpty) {
                throw StateError('No queued response for $key');
              }

              final reply = queue.removeAt(0);
              final body = reply.data == null ? '' : jsonEncode(reply.data);
              return ResponseBody.fromString(
                body,
                reply.statusCode,
                headers: {
                  Headers.contentTypeHeader: [Headers.jsonContentType],
                },
              );
            }

            @override
            void close({bool force = false}) {}
          }

          """.replace('          ', '')
          text = text[:class_start] + adapter + text[class_end:]
          path.write_text(text)
          PY
      - name: Get Flutter dependencies
        working-directory: mobile/da_secure
        run: flutter pub get
      - name: Validate targeted runtime contracts
        working-directory: mobile/da_secure
        run: flutter test test/runtime_contract_test.dart
      - name: Validate full Flutter suite
        working-directory: mobile/da_secure
        run: flutter test
      - name: Verify Dart format
        working-directory: mobile/da_secure
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: mobile/da_secure
        run: flutter analyze
      - name: Build debug APK
        working-directory: mobile/da_secure
        run: flutter build apk --debug
      - name: Commit validated closure and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/runtime-test-closure-one-shot.yml
          git add mobile/da_secure/test/runtime_contract_test.dart
          git diff --cached --check
          git config user.name "da-secure-runtime-convergence"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test(mobile): close auth refresh and FCM runtime contracts"
          git push origin HEAD:lead/da-secure-runtime-convergence
