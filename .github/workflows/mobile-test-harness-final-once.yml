name: DA Secure Mobile Refresh Harness Final Once

on:
  push:
    branches:
      - worker/da-secure-flutter-real-runtime

permissions:
  contents: write

jobs:
  fix-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: mobile/da_secure
        run: flutter pub get
      - name: Replace interceptor mock with transport adapter
        shell: python
        run: |
          from pathlib import Path
          path = Path('mobile/da_secure/test/runtime_contract_test.dart')
          text = path.read_text()

          text = text.replace("import 'dart:io';\n", "import 'dart:convert';\nimport 'dart:io';\nimport 'dart:typed_data';\n", 1)
          text = text.replace('late _QueueApiInterceptor api;', 'late _QueueHttpClientAdapter api;', 1)
          text = text.replace('late _QueueApiInterceptor refresh;', 'late _QueueHttpClientAdapter refresh;', 1)

          old_setup = """    client = ApiClient(storage: storage, dio: apiDio, refreshDio: refreshDio);\n    api = _QueueApiInterceptor();\n    refresh = _QueueApiInterceptor();\n    apiDio.interceptors.add(api);\n    refreshDio.interceptors.add(refresh);\n"""
          new_setup = """    api = _QueueHttpClientAdapter();\n    refresh = _QueueHttpClientAdapter();\n    apiDio.httpClientAdapter = api;\n    refreshDio.httpClientAdapter = refresh;\n    client = ApiClient(storage: storage, dio: apiDio, refreshDio: refreshDio);\n"""
          if text.count(old_setup) != 1:
              raise SystemExit('Expected test setup block exactly once')
          text = text.replace(old_setup, new_setup, 1)

          start = text.index('class _QueueApiInterceptor extends Interceptor {')
          end = text.index('\nclass _QueuedReply {', start)
          replacement = """class _QueueHttpClientAdapter implements HttpClientAdapter {\n  final Map<String, List<_QueuedReply>> _replies = {};\n  final List<RequestOptions> history = [];\n\n  void enqueue(String method, String path, int statusCode, dynamic data) {\n    final key = '${method.toUpperCase()} $path';\n    _replies.putIfAbsent(key, () => []).add(_QueuedReply(statusCode, data));\n  }\n\n  @override\n  Future<ResponseBody> fetch(\n    RequestOptions options,\n    Stream<Uint8List>? requestStream,\n    Future<void>? cancelFuture,\n  ) async {\n    history.add(options);\n    final key = '${options.method.toUpperCase()} ${options.path}';\n    final queue = _replies[key];\n    if (queue == null || queue.isEmpty) {\n      throw StateError('No queued response for $key');\n    }\n\n    final reply = queue.removeAt(0);\n    final body = reply.data == null ? '' : jsonEncode(reply.data);\n    return ResponseBody.fromString(\n      body,\n      reply.statusCode,\n      headers: {Headers.contentTypeHeader: ['application/json; charset=utf-8']},\n    );\n  }\n\n  @override\n  void close({bool force = false}) {}\n}\n"""
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
      - name: Format
        working-directory: mobile/da_secure
        run: dart format lib test
      - name: Analyze
        working-directory: mobile/da_secure
        run: flutter analyze
      - name: Test
        working-directory: mobile/da_secure
        run: flutter test
      - name: Validate scoped diff
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "mobile/da_secure/test/runtime_contract_test.dart"
          git diff -- mobile/da_secure/test/runtime_contract_test.dart
          if git diff -- mobile/da_secure/test/runtime_contract_test.dart | grep -E '^\+.*(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})'; then
            echo 'Potential secret material detected.' >&2
            exit 1
          fi
      - name: Commit and push test harness closure
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/da_secure/test/runtime_contract_test.dart
          git commit -m 'test(mobile): exercise refresh through Dio transport adapter'
          git push origin HEAD:worker/da-secure-flutter-real-runtime
