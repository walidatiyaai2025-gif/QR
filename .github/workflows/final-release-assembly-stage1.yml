name: DA Secure Final Release Assembly Stage 1

on:
  push:
    branches:
      - worker/da-secure-final-release-assembly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assembly-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact assembly head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Stage 1 composition
        shell: bash
        run: |
          set -euo pipefail
          base='ff0de0dbf305e50472f446b0ad751cf550a2c3e2'
          preflight='7e638b5d95ea7c03ec7c45946077f8f6127928e1'
          iis='457078e6f744222ccab86ca129a687b9fd6490df'
          branding='63dafa435086c69e02627e1e9c70caa6617c0046'

          for sha in "$base" "$preflight" "$iis" "$branding"; do
            git cat-file -e "$sha^{commit}"
            git merge-base --is-ancestor "$sha" HEAD
          done

          # P2 localization and Bidi protections from the proven preflight composition.
          grep -Fq 'DaPresentationText.localizedRuntimeDate' mobile/da_secure/lib/features/inbox/presentation/inbox_screen.dart
          grep -Fq 'DaPresentationText.isolateTechnical' mobile/da_secure/lib/features/inbox/presentation/inbox_screen.dart
          grep -Fq 'DaPresentationText.localizedRuntimeDate' mobile/da_secure/lib/features/inbox/presentation/secure_message_screen.dart
          grep -Fq 'DaPresentationText.isolateDynamic' mobile/da_secure/lib/features/inbox/presentation/secure_message_screen.dart
          grep -Fq 'Flexible(' mobile/da_secure/lib/features/inbox/presentation/secure_message_screen.dart
          grep -Fq 'softWrap: true' mobile/da_secure/lib/features/inbox/presentation/secure_message_screen.dart
          grep -Fq 'label: strings.home' mobile/da_secure/lib/features/inbox/presentation/inbox_screen.dart
          grep -Fq 'label: strings.inbox' mobile/da_secure/lib/features/inbox/presentation/inbox_screen.dart
          grep -Fq 'label: strings.profile' mobile/da_secure/lib/features/inbox/presentation/inbox_screen.dart
          test -f mobile/da_secure/test/localization_p2_presentation_test.dart
          grep -Fq 'Navigation shell exposes localized labels in Arabic' mobile/da_secure/test/mobile_ui_contract_test.dart
          grep -Fq 'Navigation shell exposes localized labels in English' mobile/da_secure/test/mobile_ui_contract_test.dart

          # Bundled Noto Sans Arabic contract.
          grep -Fq 'family: NotoSansArabic' mobile/da_secure/pubspec.yaml
          grep -Fq 'NotoSansArabic[wdth,wght].ttf' mobile/da_secure/pubspec.yaml
          test -s 'mobile/da_secure/assets/fonts/noto_sans_arabic/NotoSansArabic[wdth,wght].ttf'
          test -s mobile/da_secure/assets/fonts/noto_sans_arabic/OFL.txt
          grep -Fq "static const fontFamily = 'NotoSansArabic';" mobile/da_secure/lib/design_system/da_secure_theme.dart

          # Premium visual composition remains present.
          test -f mobile/da_secure/lib/design_system/premium_visuals.dart
          grep -Fq 'DaBrandIdentity' mobile/da_secure/lib/features/splash/presentation/splash_screen.dart

          # Exact verified branding paths only; do not inherit unrelated branding-branch files.
          branding_paths=(
            mobile/da_secure/assets/brand/diwan_crest.png
            mobile/da_secure/android/app/src/main/AndroidManifest.xml
            mobile/da_secure/android/app/src/main/res/values/colors.xml
            mobile/da_secure/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            mobile/da_secure/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          )
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            branding_paths+=(
              "mobile/da_secure/android/app/src/main/res/mipmap-${density}/ic_launcher.png"
              "mobile/da_secure/android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
              "mobile/da_secure/android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.png"
            )
          done
          for path in "${branding_paths[@]}"; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$branding:$path")"
          done
          grep -Fq 'android:icon="@mipmap/ic_launcher"' mobile/da_secure/android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@mipmap/ic_launcher_round"' mobile/da_secure/android/app/src/main/AndroidManifest.xml

          # Exact IIS hotfix files.
          iis_paths=(
            .github/workflows/iis-deployment-package.yml
            deployment/iis/BUILD-MANIFEST.json
            deployment/iis/Install-QR-IIS.ps1
            deployment/iis/QR-IIS.Common.ps1
            deployment/iis/README.md
            deployment/iis/Rollback-QR-IIS.ps1
            deployment/iis/Test-QR-IIS.Regression.ps1
            deployment/iis/Update-QR-IIS.ps1
          )
          for path in "${iis_paths[@]}"; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$iis:$path")"
          done

          echo 'STAGE1_COMPOSITION=PASS'

  backend:
    needs: assembly-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact assembly head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release

      - name: Test
        run: dotnet test

  mobile:
    needs: assembly-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/da_secure
    steps:
      - name: Checkout exact assembly head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format verification
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests and non-regression count
        shell: bash
        run: |
          set -euo pipefail
          flutter test 2>&1 | tee /tmp/da-secure-flutter-tests.log
          count="$(grep -oE '[0-9]+ tests passed' /tmp/da-secure-flutter-tests.log | tail -n 1 | awk '{print $1}')"
          if test -z "$count"; then
            echo 'Unable to determine Flutter passing test count.' >&2
            exit 1
          fi
          if test "$count" -lt 120; then
            echo "Flutter test count decreased: $count < 120" >&2
            exit 1
          fi
          echo "FLUTTER_TESTS=$count"

      - name: Build debug APK
        run: flutter build apk --debug
