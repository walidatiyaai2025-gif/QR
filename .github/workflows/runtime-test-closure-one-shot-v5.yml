name: DA Secure Runtime Test Closure One Shot V5

on:
  push:
    branches:
      - lead/da-secure-runtime-convergence
    paths:
      - .github/workflows/runtime-test-closure-one-shot-v5.yml

permissions:
  contents: write

jobs:
  validate-commit-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lead/da-secure-runtime-convergence
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply validated runtime harness and Android toolchain closure
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import textwrap

          # Reuse the already validated behavioral runtime/FCM harness closure.
          workflow = Path('.github/workflows/runtime-test-closure-one-shot.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          recipe = textwrap.dedent(workflow[start:end])
          exec(compile(recipe, '<validated-runtime-closure-recipe>', 'exec'))

          runtime_test = Path('mobile/da_secure/test/runtime_contract_test.dart')
          runtime_text = runtime_test.read_text()
          old = "if (deliveryId != null) 'deliveryId': deliveryId,"
          new = "'deliveryId': ?deliveryId,"
          if runtime_text.count(old) != 1:
              raise SystemExit(f'expected one analyzer marker, found {runtime_text.count(old)}')
          runtime_test.write_text(runtime_text.replace(old, new, 1))

          # Flutter 3.47.1 exact compatibility: no validation bypasses.
          settings = Path('mobile/da_secure/android/settings.gradle.kts')
          settings_text = settings.read_text()
          agp_old = 'id("com.android.application") version "8.9.1" apply false'
          agp_new = 'id("com.android.application") version "8.11.1" apply false'
          kotlin_old = 'id("org.jetbrains.kotlin.android") version "2.1.0" apply false'
          kotlin_new = 'id("org.jetbrains.kotlin.android") version "2.2.20" apply false'
          if settings_text.count(agp_old) != 1:
              raise SystemExit('expected AGP 8.9.1 marker not found exactly once')
          if settings_text.count(kotlin_old) != 1:
              raise SystemExit('expected Kotlin 2.1.0 marker not found exactly once')
          settings_text = settings_text.replace(agp_old, agp_new, 1)
          settings_text = settings_text.replace(kotlin_old, kotlin_new, 1)
          settings.write_text(settings_text)

          # Pin the permanent exact-head convergence gate to the validated Flutter toolchain.
          permanent = Path('.github/workflows/runtime-convergence-verify.yml')
          permanent_text = permanent.read_text()
          marker = "        with:\n          channel: stable\n          cache: true\n"
          replacement = "        with:\n          flutter-version: '3.47.1'\n          channel: stable\n          cache: true\n"
          if permanent_text.count(marker) != 1:
              raise SystemExit('permanent Flutter action marker not found exactly once')
          permanent.write_text(permanent_text.replace(marker, replacement, 1))
          PY2

      - name: Get Flutter dependencies
        working-directory: mobile/da_secure
        run: flutter pub get

      - name: Canonically format patched test
        working-directory: mobile/da_secure
        run: dart format test/runtime_contract_test.dart

      - name: Validate auth refresh contracts
        working-directory: mobile/da_secure
        run: flutter test test/runtime_contract_test.dart

      - name: Validate FCM convergence contracts
        working-directory: mobile/da_secure
        run: flutter test test/fcm_convergence_test.dart

      - name: Validate refresh scope contract
        working-directory: mobile/da_secure
        run: flutter test test/refresh_scope_contract_test.dart

      - name: Validate full Flutter suite
        working-directory: mobile/da_secure
        run: flutter test

      - name: Verify Dart format
        working-directory: mobile/da_secure
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: mobile/da_secure
        run: flutter analyze

      - name: Verify Android toolchain and identity source
        shell: bash
        run: |
          grep -F 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip' mobile/da_secure/android/gradle/wrapper/gradle-wrapper.properties
          grep -F 'id("com.android.application") version "8.11.1" apply false' mobile/da_secure/android/settings.gradle.kts
          grep -F 'id("org.jetbrains.kotlin.android") version "2.2.20" apply false' mobile/da_secure/android/settings.gradle.kts
          grep -F 'applicationId = "com.qr.mobile.da"' mobile/da_secure/android/app/build.gradle.kts
          grep -F 'sourceCompatibility = JavaVersion.VERSION_17' mobile/da_secure/android/app/build.gradle.kts
          grep -F 'android:label="DA Secure"' mobile/da_secure/android/app/src/main/AndroidManifest.xml
          grep -F '"package_name": "com.qr.mobile.da"' mobile/da_secure/android/app/google-services.json

      - name: Build debug APK
        working-directory: mobile/da_secure
        run: flutter build apk --debug

      - name: Verify APK exists
        shell: bash
        run: |
          test -s mobile/da_secure/build/app/outputs/flutter-apk/app-debug.apk
          sha256sum mobile/da_secure/build/app/outputs/flutter-apk/app-debug.apk

      - name: Commit validated closure and remove one-shot workflows
        shell: bash
        run: |
          # Flutter tooling may rewrite template metadata during validation; do not persist generated migrations.
          git restore --worktree mobile/da_secure/analysis_options.yaml 2>/dev/null || true
          git restore --worktree mobile/da_secure/android/app/build.gradle.kts 2>/dev/null || true
          git restore --worktree mobile/da_secure/android/gradle.properties 2>/dev/null || true

          git rm .github/workflows/runtime-test-closure-one-shot.yml
          git rm .github/workflows/runtime-test-closure-one-shot-v2.yml
          git rm .github/workflows/runtime-test-closure-one-shot-v3.yml
          git rm .github/workflows/runtime-test-closure-one-shot-v4.yml
          git rm .github/workflows/runtime-test-closure-one-shot-v5.yml
          git add mobile/da_secure/test/runtime_contract_test.dart
          git add mobile/da_secure/android/settings.gradle.kts
          git add .github/workflows/runtime-convergence-verify.yml
          git diff --cached --check
          git status --short

          git config user.name "da-secure-runtime-convergence"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test(mobile): close runtime contracts and Android toolchain"
          git push origin HEAD:lead/da-secure-runtime-convergence
