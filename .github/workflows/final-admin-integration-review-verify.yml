name: DA Secure Final Admin Integration Review

on:
  push:
    branches:
      - worker/da-secure-final-admin-integration-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend-release-restore-build-test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Restore
        shell: pwsh
        run: dotnet restore SecureQrPortal.sln
      - name: Build Release
        shell: pwsh
        run: dotnet build SecureQrPortal.sln -c Release --no-restore
      - name: Test Release
        shell: pwsh
        run: dotnet test SecureQrPortal.sln -c Release --no-build --logger "trx;LogFileName=final-admin-integration-review.trx" --results-directory TestResults
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-admin-integration-backend-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  flutter:
    name: flutter-format-analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact review head
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: mobile/da_secure
        run: flutter pub get
      - name: Format gate
        working-directory: mobile/da_secure
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: mobile/da_secure
        run: flutter analyze
      - name: Test
        working-directory: mobile/da_secure
        run: flutter test
