name: DA Secure CAPTCHA Integration Verify

on:
  push:
    branches:
      - feat/secure-qr-mobile-app-isolated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  captcha-integration-build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Restore
        shell: pwsh
        run: dotnet restore SecureQrPortal.sln
      - name: Build Release
        shell: pwsh
        run: dotnet build SecureQrPortal.sln --configuration Release --no-restore
      - name: Test Release
        shell: pwsh
        run: dotnet test SecureQrPortal.sln --configuration Release --no-build --logger "trx;LogFileName=captcha-integration-tests.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: da-secure-captcha-integration-tests
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
