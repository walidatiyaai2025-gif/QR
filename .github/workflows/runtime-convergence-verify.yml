name: DA Secure Runtime Convergence Verify

on:
  push:
    branches:
      - lead/da-secure-runtime-convergence
  pull_request:
    branches:
      - feat/secure-qr-mobile-app-isolated
    paths:
      - 'src/**'
      - 'tests/**'
      - 'mobile/da_secure/**'
      - 'SecureQrPortal.sln'
      - 'global.json'
      - '.github/workflows/runtime-convergence-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend-release-build-test
    runs-on: windows-latest
    steps:
      - name: Checkout exact convergence head
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore SecureQrPortal.sln

      - name: Build Release
        run: dotnet build SecureQrPortal.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test SecureQrPortal.sln --configuration Release --no-build --logger "trx;LogFileName=runtime-convergence-backend.trx" --results-directory TestResults

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: da-secure-runtime-convergence-backend-tests
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  flutter:
    name: flutter-format-analyze-test-apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/da_secure
    steps:
      - name: Checkout exact convergence head
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Dart format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify Android identity and Firebase client config
        shell: bash
        run: |
          grep -F 'applicationId = "com.qr.mobile.da"' android/app/build.gradle.kts
          grep -F 'android:label="DA Secure"' android/app/src/main/AndroidManifest.xml
          grep -F '"package_name": "com.qr.mobile.da"' android/app/google-services.json

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: da-secure-runtime-convergence-debug-apk
          path: mobile/da_secure/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
