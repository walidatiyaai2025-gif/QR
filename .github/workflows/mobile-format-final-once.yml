name: DA Secure Mobile Final Format Once

on:
  push:
    branches:
      - worker/da-secure-flutter-real-runtime

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile/da_secure
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Apply exact Dart formatter
        run: dart format lib test
      - name: Commit formatter output
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- lib test; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style(mobile): finalize Dart format with package config"
          git push origin HEAD:worker/da-secure-flutter-real-runtime
