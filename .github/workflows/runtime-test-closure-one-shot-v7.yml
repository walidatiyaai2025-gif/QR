name: DA Secure Runtime Test Closure One Shot V7

on:
  push:
    branches:
      - lead/da-secure-runtime-convergence
    paths:
      - .github/workflows/runtime-test-closure-one-shot-v7.yml

permissions:
  contents: write

jobs:
  validate-commit-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lead/da-secure-runtime-convergence
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply previously validated runtime and Android closure
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/runtime-test-closure-one-shot.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          recipe = textwrap.dedent(workflow[start:end])
          exec(compile(recipe, '<validated-runtime-harness-recipe>', 'exec'))

          runtime_test = Path('mobile/da_secure/test/runtime_contract_test.dart')
          runtime_text = runtime_test.read_text()
          old = "if (deliveryId != null) 'deliveryId': deliveryId,"
          new = "'deliveryId': ?deliveryId,"
          if runtime_text.count(old) != 1:
              raise SystemExit(f'expected one analyzer marker, found {runtime_text.count(old)}')
          runtime_test.write_text(runtime_text.replace(old, new, 1))

          settings = Path('mobile/da_secure/android/settings.gradle.kts')
          settings_text = settings.read_text()
          replacements = {
              'id("com.android.application") version "8.9.1" apply false': 'id("com.android.application") version "8.11.1" apply false',
              'id("org.jetbrains.kotlin.android") version "2.1.0" apply false': 'id("org.jetbrains.kotlin.android") version "2.2.20" apply false',
          }
          for old_value, new_value in replacements.items():
              if settings_text.count(old_value) != 1:
                  raise SystemExit(f'expected toolchain marker not found exactly once: {old_value}')
              settings_text = settings_text.replace(old_value, new_value, 1)
          settings.write_text(settings_text)

          manifest = Path('mobile/da_secure/android/app/src/main/AndroidManifest.xml')
          manifest_text = manifest.read_text()
          old_icon = '        android:name="${applicationName}"\n        android:icon="@mipmap/ic_launcher">'
          new_icon = '        android:name="${applicationName}">'
          if manifest_text.count(old_icon) != 1:
              raise SystemExit(f'expected one unresolved launcher marker, found {manifest_text.count(old_icon)}')
          manifest.write_text(manifest_text.replace(old_icon, new_icon, 1))
          PY2

      - name: Get Flutter dependencies
        working-directory: mobile/da_secure
        run: flutter pub get

      - name: Canonically format patched test
        working-directory: mobile/da_secure
        run: dart format test/runtime_contract_test.dart

      - name: Targeted auth refresh contracts
        working-directory: mobile/da_secure
        run: flutter test test/runtime_contract_test.dart

      - name: Targeted FCM contracts
        working-directory: mobile/da_secure
        run: flutter test test/fcm_convergence_test.dart

      - name: Targeted refresh scope
        working-directory: mobile/da_secure
        run: flutter test test/refresh_scope_contract_test.dart

      - name: Full Flutter suite
        working-directory: mobile/da_secure
        run: flutter test

      - name: Format gate
        working-directory: mobile/da_secure
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze gate
        working-directory: mobile/da_secure
        run: flutter analyze

      - name: Android identity and toolchain gate
        shell: bash
        run: |
          grep -F 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip' mobile/da_secure/android/gradle/wrapper/gradle-wrapper.properties
          grep -F 'id("com.android.application") version "8.11.1" apply false' mobile/da_secure/android/settings.gradle.kts
          grep -F 'id("org.jetbrains.kotlin.android") version "2.2.20" apply false' mobile/da_secure/android/settings.gradle.kts
          grep -F 'applicationId = "com.qr.mobile.da"' mobile/da_secure/android/app/build.gradle.kts
          grep -F 'sourceCompatibility = JavaVersion.VERSION_17' mobile/da_secure/android/app/build.gradle.kts
          grep -F 'android:label="DA Secure"' mobile/da_secure/android/app/src/main/AndroidManifest.xml
          grep -F '"package_name": "com.qr.mobile.da"' mobile/da_secure/android/app/google-services.json
          if grep -F '@mipmap/ic_launcher' mobile/da_secure/android/app/src/main/AndroidManifest.xml; then exit 1; fi

      - name: Build debug APK
        working-directory: mobile/da_secure
        run: flutter build apk --debug

      - name: Verify debug APK
        shell: bash
        run: |
          test -s mobile/da_secure/build/app/outputs/flutter-apk/app-debug.apk
          sha256sum mobile/da_secure/build/app/outputs/flutter-apk/app-debug.apk

      - name: Persist only validated non-workflow changes
        shell: bash
        run: |
          git restore --worktree mobile/da_secure/analysis_options.yaml 2>/dev/null || true
          git restore --worktree mobile/da_secure/android/app/build.gradle.kts 2>/dev/null || true
          git restore --worktree mobile/da_secure/android/gradle.properties 2>/dev/null || true
          git add mobile/da_secure/test/runtime_contract_test.dart
          git add mobile/da_secure/android/settings.gradle.kts
          git add mobile/da_secure/android/app/src/main/AndroidManifest.xml
          git diff --cached --check
          git diff --cached --name-only
          git config user.name "da-secure-runtime-convergence"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test(mobile): close runtime contracts and APK gate"
          git push origin HEAD:lead/da-secure-runtime-convergence
