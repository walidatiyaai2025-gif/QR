name: DA Secure Mobile Analyze Fix Once

on:
  push:
    branches:
      - worker/da-secure-flutter-real-runtime

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile/da_secure
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply exact analyzer fixes
        shell: python
        run: |
          from pathlib import Path

          failure = Path('lib/networking/app_failure.dart')
          text = failure.read_text()
          old = "case DioExceptionType.connectionTimeout:\n      case DioExceptionType.sendTimeout:"
          new = "case DioExceptionType.connectionTimeout:\n      case DioExceptionType.transformTimeout:\n      case DioExceptionType.sendTimeout:"
          if old not in text:
              raise SystemExit('Expected Dio timeout switch pattern not found')
          failure.write_text(text.replace(old, new, 1))

          for relative in [
              'lib/features/inbox/presentation/inbox_screen.dart',
              'lib/routing/app_router.dart',
          ]:
              path = Path(relative)
              source = path.read_text()
              if '(_, __)' not in source:
                  raise SystemExit(f'Expected underscore callback pattern not found in {relative}')
              path.write_text(source.replace('(_, __)', '(_, _)'))

          tests = Path('test/runtime_contract_test.dart')
          source = tests.read_text()
          if source.count('_runtime()') < 3:
              raise SystemExit('Expected runtime helper references not found')
          tests.write_text(source.replace('_runtime()', 'createRuntime()'))
      - name: Format exact changes
        run: dart format lib test
      - name: Commit fixes
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "fix(mobile): clear Flutter analyzer blockers"
          git push origin HEAD:worker/da-secure-flutter-real-runtime
