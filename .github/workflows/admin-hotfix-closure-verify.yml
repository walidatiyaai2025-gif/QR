name: DA Secure Admin Hotfix Closure Verify

on:
  push:
    branches:
      - worker/da-secure-admin-hotfix-closure
  pull_request:
    branches:
      - lead/da-secure-runtime-convergence
    paths:
      - 'src/**'
      - 'tests/**'
      - 'SecureQrPortal.sln'
      - 'global.json'
      - '.github/workflows/admin-hotfix-closure-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-hotfix:
    name: backend-release-build-test
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact hotfix head
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Restore
        shell: pwsh
        run: dotnet restore SecureQrPortal.sln

      - name: Build Release
        shell: pwsh
        run: dotnet build SecureQrPortal.sln --configuration Release --no-restore

      - name: Test Release
        shell: pwsh
        run: dotnet test SecureQrPortal.sln --configuration Release --no-build --logger "trx;LogFileName=admin-hotfix-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: da-secure-admin-hotfix-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
